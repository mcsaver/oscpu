# NPC RV64 Linux/Ubuntu bring-up 平台配置。
# 这个文件是 OpenSBI/Linux/DTB/initramfs/rootfs 入口的单一事实来源，
# 避免 RAM、镜像装载地址和设备中断号散落在 Makefile/DTS/C++/RTL 中。
memory:
  base: 0x80000000
  size: 0x20000000   # 512 MiB，给完整 Ubuntu 22.04 rootfs/systemd 留出页缓存和用户态余量

reset:
  pc: 0x80000000
  boot_hartid: 0

opensbi:
  fw_jump: Linux/env/build/opensbi-npc/platform/generic/firmware/fw_jump.bin
  fw_jump_addr: 0x80000000

kernel:
  load_addr: 0x80200000
  image: Linux/env/src/linux/arch/riscv/boot/Image

dtb:
  load_addr: 0x82200000
  build_dir: Linux/build

# NEMU/NPC 没有真实硬件 RNG；用 DTB rng-seed 走 Linux 官方 bootloader
# 随机种子入口，避免 systemd 早期 getrandom 在无熵状态下停住。
chosen:
  rng_seed: "79 73 79 78 2d 72 76 36 34 2d 6e 65 6d 75 2d 73 79 73 74 65 6d 64 2d 72 6e 67 2d 73 65 65 64 01"

initrd:
  load_addr: 0x84000000
  image: Linux/env/images/initramfs/rootfs.cpio

ubuntu_initrd:
  image: Linux/env/images/ubuntu2204/ubuntu-22.04-riscv64-probe.cpio

rootfs:
  image: Linux/env/images/ubuntu2204/ubuntu-22.04-riscv64.ext4

devices:
  clint:
    base: 0x02000000
    size: 0x00010000
  plic:
    base: 0x0c000000
    size: 0x04000000
    sources_initramfs: 1
    sources_rootfs: 32
  uart0:
    base: 0x10000000
    size: 0x1000
    irq: 1
    clock_frequency: 1843200
    current_speed: 115200
  virtio_blk:
    base: 0x10001000
    size: 0x1000
    irq: 2
  virtio_rng:
    base: 0x10002000
    size: 0x1000
    irq: 3
  goldfish_rtc:
    base: 0x10003000
    size: 0x1000
    irq: 4
  reset_syscon:
    base: 0x00100000
    size: 0x1000
    poweroff_value: 0x5555
    reboot_value: 0x7777

bootargs:
  kernel: "console=ttyS0,115200n8 earlycon=sbi loglevel=8 ignore_loglevel"
  initramfs: "console=ttyS0,115200n8 earlycon=sbi loglevel=8 ignore_loglevel rdinit=/bin/sh"
  ubuntu_initramfs: "console=ttyS0,115200n8 earlycon=sbi loglevel=8 ignore_loglevel rdinit=/init nowatchdog softlockup_panic=0"
  rootfs: "console=ttyS0,115200n8 root=/dev/vda rw init=/lib/systemd/systemd"
