# NPC RV64 Linux/Ubuntu bring-up 平台配置(NPC 专属部分)。
#
# 共享 SoC 契约(内存/装载布局/共有设备/共享 bootargs)在 common-rv64.yml,
# 本文件经 gen_dts.py 深合并覆盖其上,只写 NPC 平台差异:产物路径与
# rootfs bootargs。Makefile 按 ARCH=riscv64-npc 自动选中本文件。

base: common-rv64.yml

# 以下路径字段中,initrd.image 是 gen_dts.py initramfs 模式未传
# --initrd-image 时的缺省 fallback(会 stat 该文件计算 initrd-end);
# 其余路径目前无代码解析(Makefile 以 PLATFORM_ROOT/BUILD_DIR 变量
# 自行展开等价路径),保留为平台产物位置的文档性单一说明。
opensbi:
  fw_jump: Linux/env/platforms/npc/build/opensbi/rootfs/platform/generic/firmware/fw_jump.bin

kernel:
  image: Linux/env/platforms/npc/build/linux/arch/riscv/boot/Image

dtb:
  build_dir: Linux/build/riscv64-npc

initrd:
  image: Linux/env/platforms/npc/images/initramfs/rootfs.cpio

ubuntu_initrd:
  image: Linux/env/platforms/npc/images/ubuntu2204/ubuntu-22.04-riscv64-probe.cpio

rootfs:
  image: Linux/env/platforms/npc/images/ubuntu2204/ubuntu-22.04-riscv64.ext4

# NPC 的 rootfs DTB 实际由 Linux/Makefile 以 --bootargs-override
# '$(NPC_ROOTFS_BOOTARGS)' 整串覆盖(init 按 console-shell 开关指向
# ysyx-npc-systemd-wrapper 或 systemd),此处的值仅作无 override 直跑
# gen_dts.py 时的缺省,与覆盖串的 systemd 直启形态保持一致。
bootargs:
  rootfs: "console=ttyS0,115200n8 root=/dev/vda rw init=/lib/systemd/systemd"
