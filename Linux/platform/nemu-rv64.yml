# NEMU RV64 Linux/Ubuntu bring-up 平台配置(NEMU 专属部分)。
#
# 共享 SoC 契约(内存/装载布局/共有设备/共享 bootargs)在 common-rv64.yml,
# 本文件经 gen_dts.py 深合并覆盖其上,只写 NEMU 平台差异:产物路径、
# NEMU 独有设备(NPC RTL 未实现,只进 NEMU rootfs DTB)与 rootfs bootargs。
# Makefile 按 ARCH=riscv64-nemu 自动选中本文件。

base: common-rv64.yml

# 以下路径字段中,initrd.image 是 gen_dts.py initramfs 模式未传
# --initrd-image 时的缺省 fallback(会 stat 该文件计算 initrd-end);
# 其余路径目前无代码解析(Makefile 以 PLATFORM_ROOT/BUILD_DIR 变量
# 自行展开等价路径),保留为平台产物位置的文档性单一说明。
opensbi:
  fw_jump: Linux/env/platforms/nemu/build/opensbi/rootfs/platform/generic/firmware/fw_jump.bin

kernel:
  image: Linux/env/platforms/nemu/build/linux/arch/riscv/boot/Image

dtb:
  build_dir: Linux/build/riscv64-nemu

initrd:
  image: Linux/env/platforms/nemu/images/initramfs/rootfs.cpio

ubuntu_initrd:
  image: Linux/env/platforms/nemu/images/ubuntu2204/ubuntu-22.04-riscv64-probe.cpio

rootfs:
  image: Linux/env/platforms/nemu/images/ubuntu2204/ubuntu-22.04-riscv64.ext4

# NEMU 独有设备:NPC RTL 未实现,避免给 NPC DTB 写实际总线无响应的节点。
# 这些节点仅在 NEMU rootfs DTB 规则以对应开关打开时进入 DTS；
# reset_syscon 已提升为 common 设备。GUI profile 的 framebuffer/input
# 地址由 check-nemu-gui-config.py 对 YAML 与 NEMU generic-map 做交叉校验；
# 其它 NEMU 独有设备仍未全部进入 check-device-address-map.sh，改地址时
# 必须人工同步 nemu/include/device/device_address.h,其中 goldfish_rtc/
# reset_syscon 还被 abstract-machine/am/include/device_address.h 消费，
# 改 common 地址时必须同步 AM/NEMU/NPC 三侧，漏改会静默失联。
devices:
  # 第一阶段 Linux 图形控制台复用 NEMU 已有的 host SDL framebuffer，
  # 通过标准 simple-framebuffer DT binding 暴露给 Linux；它不是 legacy
  # vgactl guest ABI，也不假装已经实现 virtio-gpu/DRM 加速。
  simple_framebuffer:
    base: 0x13000000
    size: 0x001d4c00   # 800 * 600 * 4
    width: 800
    height: 600
    stride: 3200
    format: x8r8g8b8
  virtio_rng:
    base: 0x10002000
    size: 0x1000
    irq: 3
  virtio_net:
    base: 0x10004000
    size: 0x1000
    irq: 5
  # 0x10005000 / IRQ 6 为未来标准 virtio-gpu 保留；simplefb 阶段不抢占。
  virtio_input:
    base: 0x10006000
    size: 0x1000
    irq: 7
  goldfish_rtc:
    base: 0x10003000
    size: 0x1000
    irq: 4
# NEMU rootfs DTB 的 bootargs 真源；Makefile 的 headless profile 不追加控制台，
# GUI bundle 通过 NEMU_ROOTFS_BOOTARGS_EXTRA=console=tty0 增加 fbcon/tty1。
bootargs:
  rootfs: "console=ttyS0,115200n8 root=/dev/vda rw init=/lib/systemd/systemd"
